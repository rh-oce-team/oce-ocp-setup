# OpenShift GitOps operator. The operator creates the default ArgoCD instance
# in openshift-gitops.
#
# The Subscription is intentionally not pinned to a startingCSV: the CSV that
# is current depends on the cluster's OpenShift version. Before applying,
# review the channel and CSV and add startingCSV:
#   oc -n openshift-marketplace get packagemanifest openshift-gitops-operator \
#     -o jsonpath='{.status.channels[*].name}{"\n"}'
#   oc -n openshift-marketplace get packagemanifest openshift-gitops-operator \
#     -o jsonpath='{range .status.channels[*]}{.name}{": "}{.currentCSV}{"\n"}{end}'
# OpenShift GitOps 1.19 ships Argo CD 3.1 and 1.20 ships 3.3. Migrate the
# ArgoCD custom resource a release at a time; see the operator documentation.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-gitops-operator
  namespace: openshift-operators
spec:
  # The Red Hat package publishes gitops-X.Y channels, with "latest" as the
  # default. A "stable" channel does not exist and leaves the Subscription with
  # ResolutionFailed, so the ArgoCD resource is never created.
  channel: latest
  installPlanApproval: Automatic
  name: openshift-gitops-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
