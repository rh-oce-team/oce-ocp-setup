apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ${WIDGET_ROUTE}
  namespace: ${GATEWAY_NAMESPACE}
spec:
  host: ${WIDGET_HOST}
  to:
    kind: Service
    name: ${GATEWAY_SERVICE}
  port:
    targetPort: ${SANDBOX_PORT}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
