# Local verification profile: portable subset of the admission stage. The
# fixed-UID SCC requires the OpenShift security API; the openclaw-system
# namespace and its RBAC apply on any cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/admission
patches:
  - patch: |-
      $patch: delete
      apiVersion: security.openshift.io/v1
      kind: SecurityContextConstraints
      metadata:
        name: oce-fixed-uid-1000
