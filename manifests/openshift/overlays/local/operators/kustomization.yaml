# Local verification profile: portable subset of the operators stage. OLM
# Subscriptions and OperatorGroups require OpenShift, so only the namespaces
# remain; the deletion patches keep them sourced from the base stage.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/operators
patches:
  - patch: |-
      $patch: delete
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: openclaw-postgres
        namespace: openclaw-postgres
  - patch: |-
      $patch: delete
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: crunchy-postgres-operator
        namespace: openclaw-postgres
  - patch: |-
      $patch: delete
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: openshift-cert-manager-operator
        namespace: cert-manager-operator
  - patch: |-
      $patch: delete
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: openshift-cert-manager-operator
        namespace: cert-manager-operator
