apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Generic manifests live in the fork; this repository keeps the stage profile.
  - github.com/red-hat-data-services/openclaw-enterprise//deploy/rhoai/manifests/openshift/base/database?ref=920dfe92c41562bb0a50f97afa1787a6ed41b22a
labels:
  - includeSelectors: false
    includeTemplates: false
    pairs:
      oce-ocp-setup/environment: stage
patches:
  # The live stage volume is 5Gi. Keep it explicit so a base change cannot
  # resize the PVC during a sync; a storage increase is a deliberate change.
  - target:
      group: postgres-operator.crunchydata.com
      kind: PostgresCluster
      name: oce-postgres
    patch: |-
      - op: replace
        path: /spec/instances/0/dataVolumeClaimSpec/resources/requests/storage
        value: 5Gi
