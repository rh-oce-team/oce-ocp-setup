# Root Application for the local pull-mode verification (k3d). Identical to
# ../root.yaml except for the source: the branch served by the local git
# daemon (see ../README.md) and the local application profile.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oce-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://host.k3d.internal:9418/oce-ocp-setup.git
    targetRevision: HEAD
    path: manifests/openshift/argocd/applications/local
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
