# Exact grants the Argo CD application controller needs to reconcile the
# adopted Kustomize stages. Bound to the OpenShift GitOps default instance's
# controller ServiceAccount; no cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oce-argocd-stages
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    verbs: [get, list, watch, use]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [operators.coreos.com]
    resources: [subscriptions, operatorgroups]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [operators.coreos.com]
    resources: [clusterserviceversions]
    verbs: [get, list, watch]
  - apiGroups: [postgres-operator.crunchydata.com]
    resources: [postgresclusters]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oce-argocd-stages
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oce-argocd-stages
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
