# Wave 1: control-plane namespace, fixed-UID SCC and its exact grants.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oce-admission
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/rh-oce-team/oce-ocp-setup.git
    targetRevision: main
    path: manifests/openshift/overlays/test/admission
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
