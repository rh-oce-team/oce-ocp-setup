# Wave 3: Envoy namespace, controller SCC grants and the GatewayClass. The
# Envoy Helm release and its CRDs stay in docs/routing.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oce-routing
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/rh-oce-team/oce-ocp-setup.git
    targetRevision: main
    path: manifests/openshift/overlays/test/routing
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
