# OpenShift test-cluster profile for the pinned OpenShell v0.1.4 chart.
# Only an isolated OCE controller may reach this unauthenticated gateway.
# Development-only plaintext transport requires the exact NetworkPolicy boundary.
fullnameOverride: openshell-gateway
server:
  disableTls: true
  auth:
    allowUnauthenticatedUsers: true
  drivers:
    kubernetes:
      allowDriverConfig: true
      resourceAdmission:
        enabled: false
      workspaceMode: operator
      operatorNamespaceLabel: openshell.ai/openclaw-workspace=true
serviceAccount:
  name: openshell-gateway
sandboxServiceAccount:
  name: openshell-sandbox
workspaceResources:
  enabled: false
podSecurityContext:
  fsGroup: null
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsUser: null
service:
  type: ClusterIP
gateway:
  image:
    registry: ghcr.io
    repository: nvidia/openshell/gateway
    digest: sha256:bdb4fe248070032c88be78f029dad9325cb698480e90486e1413a674a5d8edc8
sandboxRuntime:
  image:
    registry: ghcr.io
    repository: nvidia/openshell/sandbox
    digest: sha256:ca00c094aeaa60681b8196cda18ab3c5dd5f7d782d4c36798256427b67599070
supervisor:
  image:
    registry: ghcr.io
    repository: nvidia/openshell/supervisor
    digest: sha256:aa681d8264af6ee860e38349ed3c76609a51778eb6d0f02743df03787b80a290
