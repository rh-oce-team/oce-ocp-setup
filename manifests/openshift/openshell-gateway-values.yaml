# OpenShift test-cluster profile for the pinned OpenShell v0.1.5 chart.
# Only an isolated OCE controller may reach this unauthenticated gateway.
# Development-only plaintext transport requires the exact NetworkPolicy boundary.
fullnameOverride: openshell-gateway
server:
  disableTls: true
  auth:
    allowUnauthenticatedUsers: true
  drivers:
    kubernetes:
      allowDriverConfig: true
      resourceAdmission:
        enabled: false
      workspaceMode: operator
      operatorNamespaceLabel: openshell.ai/openclaw-workspace=true
# OpenShell 0.1.5 rejects Sandbox template labels unless the operator allows them.
gatewayConfig:
  openshell.drivers.kubernetes:
    allowed_pod_labels:
      - openclaw.dev/*
      - app.kubernetes.io/name
      - app.kubernetes.io/managed-by
serviceAccount:
  name: openshell-gateway
sandboxServiceAccount:
  name: openshell-sandbox
workspaceResources:
  enabled: false
podSecurityContext:
  fsGroup: null
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsUser: null
service:
  type: ClusterIP
gateway:
  image:
    registry: ghcr.io
    repository: nvidia/openshell/gateway
    digest: sha256:ca0bc15a045017ee20bfab682f1a561eca6e6c6ed7d021d20641da24aaa6dfb6
sandboxRuntime:
  image:
    registry: ghcr.io
    repository: nvidia/openshell/sandbox
    digest: sha256:e9adf9ecde328122414ad2ee8c6fc5d5b389e4cf168daf4357c46f5a77d55851
supervisor:
  image:
    registry: ghcr.io
    repository: nvidia/openshell/supervisor
    digest: sha256:fabcd01f656e9d23df4386f82e80b4f48b90f3452d7d5c58889007643a069161
